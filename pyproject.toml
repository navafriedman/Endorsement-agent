[project]
name = "endorsement-crawler"
version = "0.1.0"
description = "An agent that crawls for political race endorsements"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
    "anthropic>=0.40.0",
    "rich>=13.0.0",
    "tenacity>=8.0.0",
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
endorsement-crawler = "endorsement_crawler.cli:main"
questionnaire-editor = "questionnaire_editor.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
